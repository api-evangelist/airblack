aid: airblack
name: Airblack
description: >-
  Airblack (Airblack Technologies Private Limited) is a Gurugram, India-based
  edtech company that runs an outcome-focused skilling academy for creators and
  micro-entrepreneurs, delivering live online makeup, beauty and culinary courses
  with professional certification through its website and Android/iOS app, plus a
  sister app, Zudo. Founded by Videt Jaiswal and backed by Info Edge Ventures and
  Elevation Capital (USD 5.2M Series A, 2021), it reports a community of 45,000+
  students. Airblack is a consumer learning product, not a platform: it publishes no
  developer program, no public API documentation and no machine-readable API contract,
  and the backend its web app calls (service.ablck.com) is a private application
  service that answers every probed path with a JSON 404.
