    url: https://www.airblack.com/terms/termsofservice
    note: >-
      Section 19.4 of the Terms of Use designates a named Grievance Officer to whom complaints
      about any content on the Platform or breaches of the Agreement/Privacy Policy are
      directed, as required by India's Intermediary Guidelines Rules. No reporting form or
      stated response window is published.
