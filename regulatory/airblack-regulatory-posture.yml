name: Airblack Regulatory Posture
description: >-
  Harvest-only record of horizontal regulatory signals. Airblack is a consumer edtech product
  incorporated in India (Airblack Technologies Private Limited, Gurugram). Its Terms of Use are
  published under Rule 3(1) of India's Information Technology (Intermediaries Guidelines)
  Rules, 2011 and name a designated Grievance Officer for complaints about platform content —
  that is the one signal recorded. No accessibility conformance report, subprocessor list, DPA,
  data-residency statement, SBOM, transparency report, AI disclosure, GPC statement or
  data-subject-request channel is published; every conventional path 404s at the Next.js
  catch-all. The privacy policy (last updated 2023-01-12) gives info@airblack.com as the
  grievance contact for personal-information concerns but publishes no request form, portal or
  stated SLA, so data_subject_request is not recorded. Terms exclude persons "incompetent to
  contract" under the Indian Contract Act, 1872 (including minors) but describe no age
  verification mechanism, so age_assurance is not recorded.
signals:
